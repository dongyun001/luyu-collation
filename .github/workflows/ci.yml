  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.12"
  #     - name: 安装 ruff
  #       run: pip install ruff
  #     - name: Lint
  #       run: ruff check src tests
