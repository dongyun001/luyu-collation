name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 敏感文件入库检查：谁把 .env / local.yaml 提交进来，CI 直接变红
  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 敏感文件入库检查
        run: |
          set -euo pipefail
          for f in .env configs/local.yaml; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::敏感文件被提交进版本库：$f"
              exit 1
            fi
          done
          echo "OK：未发现 .env / configs/local.yaml 入库"

  test:
    needs: secrets-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: 运行测试
        run: python -m pytest tests/ -v

  # 可选：需要 lint 时取消注释，并先在本地 `pip install ruff && ruff check src tests` 跑通
  # lint:
  #   needs: secrets-check
  #   runs-on: ubuntu-latest
