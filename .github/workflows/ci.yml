name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 敏感文件入库检查：谁把 .env 提交进来，CI 直接变红
  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 敏感文件入库检查
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env 被提交进版本库，请删除后重试"
            exit 1
          fi
          echo "OK：未发现 .env 入库"

  build:
    needs: secrets-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建检查
        run: npm run build
