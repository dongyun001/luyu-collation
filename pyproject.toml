[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guji-collation-tool"
version = "0.1.0"
description = "古籍文献智能校勘工具：OCR 识别、自动标点、断句、异文校勘与文白翻译"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
llm = ["openai>=1.30"]
ocr = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
test = ["pytest>=8.0"]

[project.scripts]
guji-run = "guji_collate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
